[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# math / parallel / rng
glam = { version = "0.30", features = ["serde"] }
rayon = "1.10"
rand = "0.9"
rand_pcg = "0.9"
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
zstd = "0.13"
smallvec = { version = "1", features = ["serde", "union"] }
# util
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
arc-swap = "1"
rustc-hash = "2"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
proptest = "1"
# NOTE: window/GPU/UI deps (winit, ash, ash-window, gpu-allocator, egui, ...) are
# declared directly in iw-render-vulkan / iw-app Cargo.toml, owned by WP2.
# internal crates
iw-core = { path = "crates/iw-core" }
iw-mesh = { path = "crates/iw-mesh" }
iw-sim = { path = "crates/iw-sim" }
iw-tectonics = { path = "crates/iw-tectonics" }
iw-geology = { path = "crates/iw-geology" }
iw-climate = { path = "crates/iw-climate" }
iw-surface = { path = "crates/iw-surface" }
iw-biomes = { path = "crates/iw-biomes" }
iw-store-postcard = { path = "crates/iw-store-postcard" }
iw-export-png = { path = "crates/iw-export-png" }
iw-render-vulkan = { path = "crates/iw-render-vulkan" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = true
